<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Sniper Deck</title>
<style>
  :root{
    --bg:#0a0c10; --panel:#12161d; --panel-2:#171d26; --line:#232b37;
    --txt:#e8edf5; --dim:#8b98ab; --accent:#4da3ff;
    --up:#25d07d; --down:#ff5c5c; --warn:#ffb020;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
  input,textarea{font:inherit;color:inherit}

  /* ---------- login ---------- */
  #login{display:none;place-items:center;min-height:100dvh;padding:24px}
  #login.on{display:grid}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px}
  .card h1{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
  .card p{margin:0 0 20px;color:var(--dim);font-size:13px}
  .field{width:100%;padding:12px 14px;margin-bottom:10px;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;outline:none}
  .field:focus{border-color:var(--accent)}
  .btn{display:block;width:100%;padding:12px;border-radius:10px;background:var(--accent);
    color:#04121f;font-weight:650;text-align:center}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---------- shell ---------- */
  #app{display:none;flex-direction:column;min-height:100dvh}
  #app.on{display:flex}
  header{position:sticky;top:0;z-index:20;background:rgba(10,12,16,.92);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}
  .hrow{display:flex;align-items:center;gap:10px}
  .brand{font-weight:700;letter-spacing:-.02em}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--up)}
  .dot.off{background:var(--down)}
  .spacer{flex:1}
  .ghost{padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--dim);font-size:12px}
  nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:7px 13px;border-radius:999px;color:var(--dim);font-size:13px;white-space:nowrap;
    border:1px solid transparent}
  nav button.on{background:var(--panel-2);color:var(--txt);border-color:var(--line)}
  main{flex:1;padding:14px;max-width:820px;width:100%;margin:0 auto}
  section{display:none}
  section.on{display:block}

  /* ---------- pieces ---------- */
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px}
  .tile h2{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:12px}
  .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat span{font-size:11px;color:var(--dim)}
  .up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)}
  .row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:none}
  .grow{flex:1;min-width:0}
  .sym{font-weight:650}
  .sub{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{padding:5px 9px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);
    font-size:12px;font-weight:600}
  .pill:active{background:var(--line)}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  pre{margin:0;padding:11px;background:#05070a;border:1px solid var(--line);border-radius:10px;
    font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre;max-height:60vh}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;
    font-size:13px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .toast.bad{border-color:var(--down);color:#ffd9d9}

  /* ---------- pending confirmations ---------- */
  #pending:empty{display:none}
  .conf{background:#1d1508;border:1px solid var(--warn);border-radius:var(--radius);
    padding:13px;margin-bottom:10px}
  .conf p{margin:0 0 10px;font-size:13.5px}
  .conf .who{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);
    font-weight:700;margin-bottom:5px}
  .conf .acts{display:flex;gap:8px}
  .conf .acts button{flex:1;padding:9px;border-radius:9px;font-weight:650;font-size:13px}
  .go{background:var(--warn);color:#1a1200}
  .no{border:1px solid var(--line);color:var(--dim)}

  /* ---------- chat ---------- */
  #log{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .msg{padding:11px 13px;border-radius:13px;max-width:88%;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
  .me{align-self:flex-end;background:var(--accent);color:#04121f;border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .ai.err{border-color:var(--down);color:#ffd9d9}
  .composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 4px;
    background:linear-gradient(transparent,var(--bg) 22%)}
  .composer textarea{flex:1;resize:none;max-height:130px;padding:11px 13px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;outline:none}
  .composer textarea:focus{border-color:var(--accent)}
  .send{width:46px;border-radius:12px;background:var(--accent);color:#04121f;font-weight:800;font-size:17px}
  .send:disabled{opacity:.45}
  .hints{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .hints button{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
</style>
</head>
<body>

<div id="login">
  <form class="card" id="loginForm">
    <h1>Sniper Deck</h1>
    <p>Panel privado. Acceso restringido.</p>
    <input class="field" id="u" placeholder="Usuario" autocomplete="username" autocapitalize="none">
    <input class="field" id="p" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="loginBtn">Entrar</button>
    <p id="loginErr" style="color:var(--down);margin:12px 0 0;font-size:13px"></p>
  </form>
</div>

<div id="app">
  <header>
    <div class="hrow">
      <span class="dot" id="live"></span>
      <span class="brand">Sniper Deck</span>
      <span class="spacer"></span>
      <button class="ghost" id="refresh">Actualizar</button>
      <button class="ghost" id="logout">Salir</button>
    </div>
    <nav>
      <button data-tab="chat" class="on">Chat</button>
      <button data-tab="pos">Posiciones</button>
      <button data-tab="bots">Bots</button>
      <button data-tab="srv">Servidor</button>
    </nav>
  </header>

  <main>
    <div id="pending"></div>

    <section id="tab-chat" class="on">
      <div class="hints">
        <button>¿Cómo voy hoy?</button>
        <button>¿Qué tengo abierto ahora mismo?</button>
        <button>¿Cuánto vale mi wallet?</button>
        <button>¿Está todo corriendo bien en el server?</button>
      </div>
      <div id="log"></div>
      <div class="composer">
        <textarea id="msg" rows="1" placeholder="Habla normal: «vende la mitad de la que va ganando»"></textarea>
        <button class="send" id="send">↑</button>
      </div>
    </section>

    <section id="tab-pos">
      <div class="tile">
        <h2>Hoy</h2>
        <div class="stats" id="statsToday"></div>
      </div>
      <div class="tile">
        <h2>Histórico</h2>
        <div class="stats" id="statsAll"></div>
      </div>
      <div class="tile">
        <h2>Abiertas</h2>
        <div id="positions"><div class="empty">Cargando…</div></div>
      </div>
      <div class="tile">
        <h2>Wallet on-chain</h2>
        <div id="wallet"><button class="pill" id="loadWallet">Consultar cadena</button></div>
      </div>
    </section>

    <section id="tab-bots">
      <div class="tile">
        <h2>Configuraciones</h2>
        <div id="bots"><div class="empty">Cargando…</div></div>
      </div>
      <div class="tile">
        <h2>Log más reciente</h2>
        <button class="pill" id="loadLog">Cargar</button>
        <pre id="logout_" style="margin-top:10px;display:none"></pre>
      </div>
    </section>

    <section id="tab-srv">
      <div class="tile">
        <h2>Servidor</h2>
        <div id="srv"><button class="pill" id="loadSrv">Consultar</button></div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const n2 = v => (v == null ? "—" : Number(v).toLocaleString("es-ES", { maximumFractionDigits: 2 }));
const sol = v => (v == null ? "—" : Number(v).toFixed(3));
const signed = v => (v >= 0 ? "+" : "") + Number(v).toFixed(1) + "%";
const cls = v => (v >= 0 ? "up" : "down");

let state = null, busy = false;

function toast(text, bad) {
  const t = el("div", "toast" + (bad ? " bad" : ""), text);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3000);
}

async function api(path, options) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
  if (res.status === 401) { show("login"); throw new Error("Sesión caducada"); }
  const body = await res.json().catch(() => ({ error: "respuesta no válida" }));
  if (!res.ok || body.ok === false) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}

function show(which) {
  $("#login").classList.toggle("on", which === "login");
  $("#app").classList.toggle("on", which === "app");
}

/* ------------------------------- login ------------------------------- */
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("#loginBtn").disabled = true;
  $("#loginErr").textContent = "";
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ user: $("#u").value, password: $("#p").value }) });
    $("#p").value = "";
    show("app");
    refresh();
  } catch (err) {
    $("#loginErr").textContent = err.message;
  } finally {
    $("#loginBtn").disabled = false;
  }
});

$("#logout").onclick = async () => { await api("/api/logout", { method: "POST" }).catch(() => {}); show("login"); };

/* -------------------------------- tabs ------------------------------- */
document.querySelectorAll("nav button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === "tab-" + b.dataset.tab));
  };
});

/* ------------------------------ rendering ---------------------------- */
function renderStats(node, perf) {
  node.innerHTML = "";
  if (!perf || perf.error) { node.appendChild(el("div", "empty", perf?.error || "sin datos")); return; }
  const items = [
    ["P&L", sol(perf.realized_pnl_sol) + " SOL", cls(perf.realized_pnl_sol)],
    ["ROI", (perf.roi_pct ?? 0).toFixed(1) + "%", cls(perf.roi_pct)],
    ["Aciertos", (perf.win_rate_pct ?? 0).toFixed(0) + "%", ""],
    ["Cerradas", String(perf.closed_count ?? 0), ""],
  ];
  for (const [label, value, klass] of items) {
    const d = el("div", "stat");
    d.appendChild(el("b", klass, value));
    d.appendChild(el("span", null, label));
    node.appendChild(d);
  }
}

function renderPositions(rows) {
  const box = $("#positions");
  box.innerHTML = "";
  if (rows?.error) { box.appendChild(el("div", "empty", rows.error)); return; }
  if (!rows || !rows.length) { box.appendChild(el("div", "empty", "Ninguna posición abierta.")); return; }
  for (const p of rows) {
    const row = el("div", "row");
    const info = el("div", "grow");
    const head = el("div");
    head.appendChild(el("span", "sym", p.symbol));
    head.appendChild(el("span", cls(p.pnl_pct), "  " + signed(p.pnl_pct)));
    info.appendChild(head);
    info.appendChild(el("div", "sub", `${p.bot} · ~${sol(p.value_sol)} SOL · actualizado hace ${Math.round(p.age_seconds)}s`));
    row.appendChild(info);
    for (const pct of [50, 100]) {
      const b = el("button", "pill", pct + "%");
      b.onclick = () => sell(p, pct);
      row.appendChild(b);
    }
    box.appendChild(row);
  }
}

async function sell(position, percent) {
  const label = `Vender ${percent}% de ${position.symbol} (${signed(position.pnl_pct)})?`;
  if (!confirm(label)) return;
  try {
    await api("/api/sell", { method: "POST", body: JSON.stringify({ suffix: position.suffix, percent }) });
    toast(`Orden enviada: ${percent}% de ${position.symbol}`);
    setTimeout(refresh, 1500);
  } catch (err) { toast(err.message, true); }
}

function renderBots(rows) {
  const box = $("#bots");
  box.innerHTML = "";
  if (rows?.error) { box.appendChild(el("div", "empty", rows.error)); return; }
  if (!rows || !rows.length) { box.appendChild(el("div", "empty", "Sin configs.")); return; }
  for (const b of rows) {
    const row = el("div", "row");
    const info = el("div", "grow");
    const head = el("div", "sym", b.name);
    if (b.has_open_position) head.appendChild(el("span", "up", "  ●"));
    info.appendChild(head);
    info.appendChild(el("div", "sub",
      `${b.buy_amount_sol ?? "?"} SOL · ${b.exit_strategy ?? "?"} · ${b.listener ?? "?"}`));
    row.appendChild(info);
    const toggle = el("button", "pill", b.enabled ? "ON" : "OFF");
    toggle.style.color = b.enabled ? "var(--up)" : "var(--dim)";
    toggle.onclick = async () => {
      if (!confirm(`${b.enabled ? "Desactivar" : "Activar"} ${b.name}? Hay que reiniciar el bot para que aplique.`)) return;
      try {
        await api("/api/bots/toggle", { method: "POST", body: JSON.stringify({ name: b.file, enabled: !b.enabled }) });
        toast("Guardado. Reinicia el bot para aplicarlo.");
        refresh();
      } catch (err) { toast(err.message, true); }
    };
    row.appendChild(toggle);
    box.appendChild(row);
  }
}

function renderPending(actions) {
  const box = $("#pending");
  box.innerHTML = "";
  for (const a of actions || []) {
    const card = el("div", "conf");
    card.appendChild(el("div", "who", "Confirmación pendiente · " + a.kind));
    card.appendChild(el("p", null, a.summary));
    const acts = el("div", "acts");
    const go = el("button", "go", "Confirmar");
    go.onclick = async () => {
      go.disabled = true;
      try {
        const out = await api("/api/agent/confirm", { method: "POST", body: JSON.stringify({ id: a.id }) });
        toast("Hecho: " + out.summary);
        refresh();
      } catch (err) { toast(err.message, true); go.disabled = false; }
    };
    const no = el("button", "no", "Descartar");
    no.onclick = async () => {
      await api("/api/agent/cancel", { method: "POST", body: JSON.stringify({ id: a.id }) }).catch(() => {});
      refresh();
    };
    acts.appendChild(go); acts.appendChild(no);
    card.appendChild(acts);
    box.appendChild(card);
  }
}

/* ------------------------------ on-demand ---------------------------- */
$("#loadWallet").onclick = async () => {
  const box = $("#wallet");
  box.innerHTML = '<div class="empty">Consultando la cadena…</div>';
  try {
    const { wallet: w } = await api("/api/wallet");
    box.innerHTML = "";
    const stats = el("div", "stats");
    for (const [label, value] of [
      ["SOL", sol(w.sol_balance)],
      ["Tokens $", n2(w.tokens_value_usd)],
      ["Total $", n2(w.total_value_usd)],
    ]) {
      const d = el("div", "stat");
      d.appendChild(el("b", null, value));
      d.appendChild(el("span", null, label));
      stats.appendChild(d);
    }
    box.appendChild(stats);
    box.appendChild(el("div", "sub mono", w.address));
    for (const h of w.holdings) {
      const row = el("div", "row");
      const info = el("div", "grow");
      info.appendChild(el("div", "sym", "$" + n2(h.value_usd)));
      info.appendChild(el("div", "sub mono", h.mint));
      row.appendChild(info);
      row.appendChild(el("div", "sub", n2(h.amount)));
      box.appendChild(row);
    }
    if (w.dust_positions_hidden) box.appendChild(el("div", "empty", `+${w.dust_positions_hidden} restos sin valor ocultos`));
  } catch (err) { box.innerHTML = ""; box.appendChild(el("div", "empty warn", err.message)); }
};

$("#loadSrv").onclick = async () => {
  const box = $("#srv");
  box.innerHTML = '<div class="empty">Consultando…</div>';
  try {
    const { health: h } = await api("/api/server");
    box.innerHTML = "";
    const stats = el("div", "stats");
    for (const [label, value] of [
      ["Carga 1m", h.load ? h.load["1m"] : "—"],
      ["Disco", h.disk.used_pct + "%"],
      ["Libre", h.disk.free_gb + " GB"],
      ["Procesos", String(h.bot_processes.length)],
    ]) {
      const d = el("div", "stat");
      d.appendChild(el("b", null, String(value)));
      d.appendChild(el("span", null, label));
      stats.appendChild(d);
    }
    box.appendChild(stats);
    for (const u of h.units || []) {
      const row = el("div", "row");
      row.appendChild(el("div", "grow mono", u.unit));
      row.appendChild(el("div", u.state === "active" ? "up" : "down", u.state));
      box.appendChild(row);
    }
    for (const p of h.bot_processes) {
      const row = el("div", "row");
      const info = el("div", "grow");
      info.appendChild(el("div", "sub mono", p.command));
      info.appendChild(el("div", "sub", `pid ${p.pid} · ${p.cpu_pct}% cpu · ${p.uptime}`));
      row.appendChild(info);
      box.appendChild(row);
    }
    if (!h.bot_processes.length) box.appendChild(el("div", "empty warn", "No veo ningún proceso del bot corriendo."));
  } catch (err) { box.innerHTML = ""; box.appendChild(el("div", "empty warn", err.message)); }
};

$("#loadLog").onclick = async () => {
  const pre = $("#logout_");
  pre.style.display = "block";
  pre.textContent = "Cargando…";
  try {
    const out = await api("/api/logs?lines=120");
    pre.textContent = out.file + "\n\n" + out.lines.join("\n");
  } catch (err) { pre.textContent = err.message; }
};

/* --------------------------------- chat ------------------------------ */
function bubble(text, who) {
  const b = el("div", "msg " + who, text);
  $("#log").appendChild(b);
  b.scrollIntoView({ behavior: "smooth", block: "end" });
  return b;
}

async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true;
  $("#send").disabled = true;
  bubble(text, "me");
  const thinking = bubble("…", "ai");
  try {
    const out = await api("/api/agent/chat", { method: "POST", body: JSON.stringify({ message: text }) });
    thinking.textContent = out.reply;
    if (out.pending?.length) { renderPending(out.pending); window.scrollTo({ top: 0, behavior: "smooth" }); }
  } catch (err) {
    thinking.textContent = err.message;
    thinking.classList.add("err");
  } finally {
    busy = false;
    $("#send").disabled = false;
  }
}

const box = $("#msg");
box.addEventListener("input", () => { box.style.height = "auto"; box.style.height = box.scrollHeight + "px"; });
box.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const v = box.value; box.value = ""; box.style.height = "auto"; ask(v); }
});
$("#send").onclick = () => { const v = box.value; box.value = ""; box.style.height = "auto"; ask(v); };
document.querySelectorAll(".hints button").forEach(b => { b.onclick = () => ask(b.textContent); });

/* ------------------------------- refresh ----------------------------- */
async function refresh() {
  try {
    state = await api("/api/state");
    $("#live").classList.remove("off");
    renderStats($("#statsToday"), state.today);
    renderStats($("#statsAll"), state.all_time);
    renderPositions(state.positions);
    renderBots(state.bots);
    renderPending(state.pending);
    if (!state.config.agent_enabled && !$("#log").children.length) {
      bubble("El chat está apagado: falta ANTHROPIC_API_KEY en el .env del panel. El resto del panel funciona igual.", "ai err");
    }
    for (const w of state.warnings || []) toast(w, true);
  } catch (err) {
    $("#live").classList.add("off");
  }
}

setInterval(() => { if ($("#app").classList.contains("on") && !document.hidden) refresh(); }, 15000);
$("#refresh").onclick = refresh;

api("/api/state").then(() => { show("app"); refresh(); }).catch(() => show("login"));
</script>
</body>
</html>
