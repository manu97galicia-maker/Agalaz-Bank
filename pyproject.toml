[project]
name = "sniper-deck"
version = "0.1.0"
description = "Panel privado para manejar el bot de sniping y su servidor"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "anthropic>=0.69",
]

[tool.ruff]
# 110 rather than the usual 88/100: the tool descriptions the agent reads are
# Spanish prose, and wrapping them makes them harder to review, not easier.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RET", "SIM"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"server/ops.py" = ["S602"]  # run_shell is the documented, double-gated escape hatch
